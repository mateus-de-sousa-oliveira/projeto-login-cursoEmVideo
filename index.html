<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css?v=2">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key" />
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a). Faça login para acessar a sua conta e fazer as configurações no seu ambiente.</p>
                <form action="login.js" method="post">
                   <div class="campo">
                        <label for="ilogin">E-mail</label>
                        <input type="email" nome="login" id="ilogin" placeholder="Seu e-mail">
                    </div>     
                   <div class="campo"> 
                        <label for="isenha">Senha</label>
                        <input type="password" nome="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                   </div>
                   <div>
                    <input type="submit" value="Entrar">
                    <a href="esqueci.html">Esqueci a senha</a>
                   </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
